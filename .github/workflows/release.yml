name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-latest,  goos: linux,   goarch: amd64, ext: .so,    cc: gcc }
          - { runner: ubuntu-latest,  goos: linux,   goarch: arm64, ext: .so,    cc: aarch64-linux-gnu-gcc, cross: true }
          - { runner: macos-13,       goos: darwin,  goarch: amd64, ext: .dylib }
          - { runner: macos-latest,   goos: darwin,  goarch: arm64, ext: .dylib }
          - { runner: windows-latest, goos: windows, goarch: amd64, ext: .dll }
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Install cross compiler
        if: matrix.cross
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gcc-aarch64-linux-gnu

      - name: Resolve version
        id: v
        shell: bash
        run: echo "version=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Build
        shell: bash
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CC: ${{ matrix.cc }}
          EXT: ${{ matrix.ext }}
          VER: ${{ steps.v.outputs.version }}
        run: |
          set -euo pipefail
          ID=stepfun-credit-tracker
          OUT="${ID}_${VER}_${GOOS}_${GOARCH}"
          mkdir -p "build/${OUT}" dist
          CGO_ENABLED=1 go build -buildmode=c-shared -trimpath -ldflags "-s -w" -o "build/${OUT}/${ID}${EXT}" .
          cd "build/${OUT}"
          if [ "$GOOS" = "windows" ]; then
            7z a -tzip "../../dist/${OUT}.zip" "${ID}${EXT}" > /dev/null
          else
            zip -q "../../dist/${OUT}.zip" "${ID}${EXT}"
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: pkg-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*.zip
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        run: |
          cd dist && ls -la && sha256sum *.zip > checksums.txt && cat checksums.txt

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.zip
            dist/checksums.txt
          generate_release_notes: true

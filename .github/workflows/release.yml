name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Resolve version
        id: v
        run: echo "version=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Install cross compilers
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gcc-aarch64-linux-gnu

      - name: Build all platforms
        env:
          VER: ${{ steps.v.outputs.version }}
        run: |
          set -euo pipefail
          ID=stepfun-credit-tracker
          mkdir -p dist

          build() {
            local goos=$1 goarch=$2 cc=$3 ext=$4
            local out="${ID}_${VER}_${goos}_${goarch}"
            echo "::group::build $out"
            mkdir -p "build/$out"
            CGO_ENABLED=1 GOOS=$goos GOARCH=$goarch CC=$cc \
              go build -buildmode=c-shared -trimpath -ldflags '-s -w' \
              -o "build/$out/${ID}${ext}" .
            (cd "build/$out" && zip -q "../../dist/${out}.zip" "${ID}${ext}")
            echo "::endgroup::"
          }

          build linux amd64 gcc .so
          build linux arm64 aarch64-linux-gnu-gcc .so

      - name: Checksums
        run: |
          cd dist
          sha256sum *.zip > checksums.txt
          cat checksums.txt

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.zip
            dist/checksums.txt
          generate_release_notes: true
